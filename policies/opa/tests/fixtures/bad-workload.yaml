# Negative fixture: every policy must reject something in this file (asserted in CI).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bad
  namespace: demo
spec:
  selector:
    matchLabels: {app: bad}
  template:
    metadata:
      labels: {app: bad}
    spec:
      hostPID: true
      containers:
        - name: bad
          image: nginx:latest
          securityContext:
            privileged: true
            runAsUser: 0
---
apiVersion: v1
kind: Service
metadata:
  name: bad-public-lb
  namespace: demo
spec:
  type: LoadBalancer
  selector: {app: bad}
  ports:
    - port: 80
