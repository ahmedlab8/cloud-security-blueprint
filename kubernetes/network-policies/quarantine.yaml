# Applied by incident-response/isolate_pod.sh: any pod labelled quarantine=true loses
# all network access (ingress and egress) while it is preserved for forensics.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: quarantine-deny-all
  namespace: secure-app
spec:
  podSelector:
    matchLabels:
      security.csb.io/quarantine: "true"
  policyTypes: ["Ingress", "Egress"]
