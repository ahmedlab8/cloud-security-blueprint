# Guardrails against resource exhaustion (DoS) and noisy neighbours.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: secure-app-quota
  namespace: secure-app
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 4Gi
    limits.cpu: "8"
    limits.memory: 8Gi
    pods: "30"
    services.loadbalancers: "0"
    services.nodeports: "0"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: secure-app-defaults
  namespace: secure-app
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 256Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      max:
        cpu: "2"
        memory: 2Gi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: secure-app
  namespace: secure-app
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: secure-app
