# EKS: mount secrets from AWS Secrets Manager via the Secrets Store CSI driver + ASCP.
# Use this OR secretproviderclass-azure.yaml depending on the cloud.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: secure-app-secrets
  namespace: secure-app
spec:
  provider: aws
  parameters:
    usePodIdentity: "false"
    objects: |
      - objectName: "csb/dev/secure-app/demo-password"
        objectType: "secretsmanager"
        objectAlias: "demo-password"
