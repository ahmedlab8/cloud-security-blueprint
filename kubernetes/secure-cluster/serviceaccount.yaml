# Dedicated identity for the workload. Token is NOT auto-mounted; the cloud identity
# annotations bind it to least-privilege IAM (EKS IRSA) or Entra workload identity (AKS).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: secure-app
  namespace: secure-app
  labels:
    app.kubernetes.io/name: secure-app
  annotations:
    # EKS: value of terraform output app_irsa_role_arn
    eks.amazonaws.com/role-arn: "arn:aws:iam::<ACCOUNT_ID>:role/csb-dev-app-irsa"
    # AKS: value of terraform output app_identity_client_id
    azure.workload.identity/client-id: "<APP_IDENTITY_CLIENT_ID>"
automountServiceAccountToken: false
