# AKS: mount secrets from Azure Key Vault using Entra workload identity (no client secrets).
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: secure-app-secrets
  namespace: secure-app
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: "<APP_IDENTITY_CLIENT_ID>"
    keyvaultName: "<KEY_VAULT_NAME>"
    tenantId: "<TENANT_ID>"
    objects: |
      array:
        - |
          objectName: demo-password
          objectType: secret
