# GENERATED by build_prometheusrule.py from rules/security-alerts.yml - do not edit.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: csb-security-alerts
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
  - name: security.runtime
    rules:
    - alert: FalcoCriticalEvent
      expr: sum by (rule, k8s_ns_name, k8s_pod_name) (increase(falcosecurity_falcosidekick_falco_events_total{priority=~"critical|alert|emergency"}[5m])) > 0
      labels:
        severity: critical
        team: security
      annotations:
        summary: 'Falco CRITICAL: {{ $labels.rule }}'
        description: Falco rule {{ $labels.rule }} fired for pod {{ $labels.k8s_pod_name }} in {{ $labels.k8s_ns_name }}. Run the incident-response playbook.
        runbook_url: https://github.com/ahmedlab8/cloud-security-blueprint/blob/main/incident-response/README.md
    - alert: FalcoWarningBurst
      expr: sum by (rule) (increase(falcosecurity_falcosidekick_falco_events_total{priority=~"warning|error"}[10m])) > 10
      for: 5m
      labels:
        severity: warning
        team: security
      annotations:
        summary: Burst of Falco warnings for {{ $labels.rule }}
        description: More than 10 {{ $labels.rule }} events in 10 minutes.
  - name: security.auth
    rules:
    - alert: HighFailedLoginRate
      expr: sum by (namespace) (rate(app_login_attempts_total{result="failure"}[5m])) > 1
      for: 5m
      labels:
        severity: warning
        team: security
      annotations:
        summary: Possible brute-force / credential stuffing in {{ $labels.namespace }}
        description: Failed logins above 1/s for 5 minutes ({{ $value | humanize }}/s).
    - alert: FailedLoginRatioHigh
      expr: "sum(rate(app_login_attempts_total{result=\"failure\"}[15m]))\n  / clamp_min(sum(rate(app_login_attempts_total[15m])), 0.001) > 0.8\nand sum(rate(app_login_attempts_total[15m])) > 0.1\n"
      for: 10m
      labels:
        severity: warning
        team: security
      annotations:
        summary: More than 80% of logins are failing
        description: Failure ratio has stayed above 80% for 10 minutes.
  - name: security.policy
    rules:
    - alert: GatekeeperViolationsPresent
      expr: sum by (enforcement_action) (gatekeeper_violations) > 0
      for: 15m
      labels:
        severity: warning
        team: platform
      annotations:
        summary: Gatekeeper audit found {{ $value }} violations ({{ $labels.enforcement_action }})
        description: Existing resources violate admission policies. Review the constraint status.
    - alert: GatekeeperWebhookDown
      expr: absent(up{job="gatekeeper"} == 1)
      for: 5m
      labels:
        severity: critical
        team: platform
      annotations:
        summary: Gatekeeper is not being scraped - admission policy enforcement may be down
        description: No healthy Gatekeeper targets for 5 minutes.
  - name: workload.health
    rules:
    - alert: ContainerRestartingFrequently
      expr: increase(kube_pod_container_status_restarts_total[15m]) > 3
      labels:
        severity: warning
      annotations:
        summary: '{{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container }}) restarting'
        description: More than 3 restarts in 15 minutes - crash loop or OOM; also a common side-effect of exploitation attempts.
    - alert: ContainerOOMKilled
      expr: max by (namespace, pod, container) (kube_pod_container_status_last_terminated_reason{reason="OOMKilled"}) == 1
      labels:
        severity: warning
      annotations:
        summary: '{{ $labels.namespace }}/{{ $labels.pod }} OOMKilled'
        description: Container {{ $labels.container }} was OOMKilled.
    - alert: ContainerCPUNearLimit
      expr: "sum by (namespace, pod, container) (rate(container_cpu_usage_seconds_total{container!=\"\",container!=\"POD\"}[5m]))\n  / sum by (namespace, pod, container) (kube_pod_container_resource_limits{resource=\"\
        cpu\"}) > 0.9\n"
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: '{{ $labels.namespace }}/{{ $labels.pod }} CPU > 90% of limit'
        description: Sustained high CPU can indicate crypto-mining. Check Falco events for this pod.
    - alert: ContainerMemoryNearLimit
      expr: "sum by (namespace, pod, container) (container_memory_working_set_bytes{container!=\"\",container!=\"POD\"})\n  / sum by (namespace, pod, container) (kube_pod_container_resource_limits{resource=\"\
        memory\"}) > 0.9\n"
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: '{{ $labels.namespace }}/{{ $labels.pod }} memory > 90% of limit'
        description: Working set is above 90% of the memory limit.
