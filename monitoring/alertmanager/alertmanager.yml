# Alertmanager routing. Webhook URLs are mounted from a Secret as files - never inline.
route:
  receiver: default
  group_by: [alertname, namespace]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: [team="security"]
      receiver: security-oncall
      continue: true
    - matchers: [severity="critical"]
      receiver: security-oncall

receivers:
  - name: default
  - name: security-oncall
    slack_configs:
      - api_url_file: /etc/alertmanager/secrets/alertmanager-webhooks/slack-webhook-url
        channel: "#security-alerts"
        send_resolved: true
        title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.summary }} - {{ .Annotations.description }}{{ "\n" }}{{ end }}'
    msteams_configs:
      - webhook_url_file: /etc/alertmanager/secrets/alertmanager-webhooks/teams-webhook-url
        send_resolved: true
